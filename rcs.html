<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="rcs.css">
</head>
<body>
    <div class="heading">
        <p>Rock Paper Scissors</p>
    </div>
    <div class="rcs">
        <div class="rock">
            <img src="rock.png" alt="rock">
            <p class="rock1">Rock</p>
        </div>
        <div class="paper">
            <img src="paper.png" alt="paper">
            <p class="paper1">Paper</p>
        </div>
        <div class="scissors">
            <img src="scissor.png" alt="scissors">
            <p class="scissors1">Scissors</p>
        </div>
    </div>
    <div class="scoreboard">
        <div class="compscore">
            <p class="compscore1" >Computer</p>
            <p class="compscore2">0</p>
        </div>
        <div class="youscore">
            <p class="youscore1" >You</p>
            <p class="youscore2">0</p>
        </div>
    </div>
    <div>
        <p class="choice">Choose rock or paper or scissors</p>
    </div>
    <div class="resetmain">
        <p class="reset">RESET</p>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="rcs.js"></script>
</body>
</html>
